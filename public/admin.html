<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administració de preguntes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Administració de preguntes</h1>
    <div id="missatge"></div>

    <form id="formPregunta" class="card card-body mb-4">
      <h2 id="titolForm" class="h4 mb-3">Nova pregunta</h2>
      <input type="hidden" id="idPregunta">
      <input type="hidden" id="imatgeActual">

      <label for="question" class="form-label">Pregunta</label>
      <input type="text" id="question" class="form-control mb-3" required>

      <p class="mb-2">Respostes (marca la correcta):</p>
      <div class="input-group mb-2">
        <div class="input-group-text"><input class="form-check-input mt-0" type="radio" name="correcta" value="0" checked></div>
        <input type="text" class="form-control resposta" placeholder="Resposta 1" required>
      </div>
      <div class="input-group mb-2">
        <div class="input-group-text"><input class="form-check-input mt-0" type="radio" name="correcta" value="1"></div>
        <input type="text" class="form-control resposta" placeholder="Resposta 2" required>
      </div>
      <div class="input-group mb-2">
        <div class="input-group-text"><input class="form-check-input mt-0" type="radio" name="correcta" value="2"></div>
        <input type="text" class="form-control resposta" placeholder="Resposta 3" required>
      </div>
      <div class="input-group mb-3">
        <div class="input-group-text"><input class="form-check-input mt-0" type="radio" name="correcta" value="3"></div>
        <input type="text" class="form-control resposta" placeholder="Resposta 4" required>
      </div>

      <label for="imatge" class="form-label">Imatge</label>
      <input type="file" id="imatge" class="form-control mb-2" accept="image/*">
      <div id="imatgePrevia" class="mb-3"></div>

      <div>
        <button type="submit" class="btn btn-primary">Desar</button>
        <button type="button" id="btnCancelar" class="btn btn-outline-secondary">Cancel·lar</button>
      </div>
    </form>

    <h2 class="h4 mb-3">Preguntes existents</h2>
    <div id="llista"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
