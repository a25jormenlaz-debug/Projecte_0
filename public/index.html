<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endevina la bandera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 600px;">
    <h1 class="text-center mb-4">Endevina la bandera</h1>

    <form id="formNom" class="card card-body hidden">
      <label for="inputNom" class="form-label">Com et dius?</label>
      <input type="text" id="inputNom" class="form-control mb-3" required>
      <button type="submit" class="btn btn-primary">Començar</button>
    </form>

    <div id="salutacio" class="hidden">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="textSalutacio" class="fs-5"></span>
        <button id="btnEsborrar" class="btn btn-sm btn-outline-secondary">Esborrar nom</button>
      </div>
    </div>

    <div id="joc" class="hidden">
      <div class="d-flex justify-content-between mb-3">
        <span id="marcador" class="badge text-bg-secondary fs-6"></span>
        <span id="temps" class="badge text-bg-dark fs-6"></span>
      </div>
      <div id="partida" class="card card-body text-center mb-3"></div>
      <button id="btnEnviar" class="btn btn-success w-100 hidden">Enviar resultats</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
